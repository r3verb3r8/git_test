name: Docker Image CI
on:
  push:
    tags:
      - "*"

jobs:
  build-and-push:
    name: Create image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GIT_TEST_CR }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/git_test:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/git_test:latest

  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: print-release
        run: echo "Version is ${{ github.ref_name }}"

      - name: Create a Release
        uses: ncipollo/release-action@v1
        with:
          name: Release ${{ github.ref_name }}
          tag: ${{ github.ref_name }}
          bodyFile: CHANGES.md
          skipIfReleaseExists: true

  update-image-version:
    name: Update Image Version in README
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Update README with new image version
        run: |
          sed -i "s/docker pull.*$/docker pull ghcr.io\/${{ github.repository_owner }}\/git_test:${{ github.ref_name }}/g" README.md
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Updated version to ${{ github.ref_name }}"
          git push origin HEAD:main
